name: Deploy AWS Amplify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag, or branch to validate and redeploy
        required: true
        default: main
        type: string

permissions: {}

env:
  ARCHIVE_NAME: amplify-deployment.zip

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out requested ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Build static site
        run: bun run build

      - name: Assert static output
        run: bun run check:output

      - name: Run Playwright smoke tests
        run: bun run test:smoke

      - name: Package Amplify artifact
        run: |
          set -euo pipefail
          (
            cd dist/client
            zip -q -r "../../${ARCHIVE_NAME}" .
          )
          unzip -t "${ARCHIVE_NAME}"
          archive_files=$(mktemp)
          unzip -Z1 "${ARCHIVE_NAME}" > "${archive_files}"
          grep -qx 'index.html' "${archive_files}"
          grep -qx 'areyou/index.html' "${archive_files}"
          grep -qx '404.html' "${archive_files}"
          if grep -qE '^(dist|client)/' "${archive_files}"; then
            echo 'Archive contains an invalid parent directory' >&2
            exit 1
          fi
          rm -f "${archive_files}"

      - name: Upload validated artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amplify-static-${{ github.run_id }}
          path: amplify-deployment.zip
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: amplify-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deployment-url.outputs.url }}
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
      AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
      AMPLIFY_DEFAULT_DOMAIN: ${{ vars.AMPLIFY_DEFAULT_DOMAIN }}
    steps:
      - name: Download validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: amplify-static-${{ github.run_id }}

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          test -n "${AWS_REGION}"
          test -n "${AWS_ROLE_ARN}"
          test -n "${AMPLIFY_APP_ID}"
          test -n "${AMPLIFY_BRANCH}"
          test -n "${AMPLIFY_DEFAULT_DOMAIN}"
          test -f "${ARCHIVE_NAME}"

      - name: Check deployment freshness
        id: freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          should_deploy=true
          if [ "${GITHUB_EVENT_NAME}" = 'push' ]; then
            current_main_sha=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
              | jq -er '.sha')
            if [ "${current_main_sha}" != "${GITHUB_SHA}" ]; then
              echo 'A newer main commit exists; skipping this stale deployment.'
              should_deploy=false
            fi
          fi
          echo "should-deploy=${should_deploy}" >> "${GITHUB_OUTPUT}"

      - name: Configure temporary AWS credentials
        if: steps.freshness.outputs.should-deploy == 'true'
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-amplify-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Publish artifact to Amplify
        if: steps.freshness.outputs.should-deploy == 'true'
        env:
          DEPLOYMENT_FILE: ${{ runner.temp }}/amplify-deployment.json
        run: |
          set -euo pipefail
          umask 077
          cleanup() {
            unset upload_url || true
            rm -f "${DEPLOYMENT_FILE}"
          }
          trap cleanup EXIT

          aws amplify create-deployment \
            --app-id "${AMPLIFY_APP_ID}" \
            --branch-name "${AMPLIFY_BRANCH}" \
            > "${DEPLOYMENT_FILE}"

          job_id=$(jq -er '.jobId' "${DEPLOYMENT_FILE}")
          upload_url=$(jq -er '.zipUploadUrl' "${DEPLOYMENT_FILE}")

          curl --fail --silent --show-error \
            --request PUT \
            --header 'Content-Type: application/zip' \
            --upload-file "${ARCHIVE_NAME}" \
            "${upload_url}" \
            > /dev/null

          unset upload_url
          rm -f "${DEPLOYMENT_FILE}"

          aws amplify start-deployment \
            --app-id "${AMPLIFY_APP_ID}" \
            --branch-name "${AMPLIFY_BRANCH}" \
            --job-id "${job_id}" \
            > /dev/null

          for attempt in $(seq 1 90); do
            status=$(aws amplify get-job \
              --app-id "${AMPLIFY_APP_ID}" \
              --branch-name "${AMPLIFY_BRANCH}" \
              --job-id "${job_id}" \
              --query 'job.summary.status' \
              --output text)
            echo "Amplify job ${job_id}: ${status} (${attempt}/90)"

            case "${status}" in
              SUCCEED)
                exit 0
                ;;
              FAILED|CANCELLED)
                echo "Amplify deployment ended with ${status}" >&2
                exit 1
                ;;
            esac

            sleep 10
          done

          echo 'Timed out waiting for the Amplify deployment' >&2
          exit 1

      - name: Verify default branch deployment
        if: steps.freshness.outputs.should-deploy == 'true'
        id: deployment-url
        run: |
          set -euo pipefail
          base_url="https://${AMPLIFY_BRANCH}.${AMPLIFY_DEFAULT_DOMAIN}"
          headers=$(mktemp)
          body=$(mktemp)

          curl --fail --silent --show-error --location \
            --dump-header "${headers}" \
            --output "${body}" \
            "${base_url}/"
          grep -q 'The DiLoreto Family' "${body}"
          grep -q 'google-site-verification' "${body}"
          if grep -Eqi '(\.netlify|/\.netlify/images)' "${body}"; then
            echo 'Netlify reference found in deployed HTML' >&2
            exit 1
          fi
          grep -Eqi '^cache-control:.*no-cache' "${headers}"
          grep -Eqi '^x-content-type-options:.*nosniff' "${headers}"

          curl --fail --silent --show-error --location --output /dev/null "${base_url}/areyou"
          curl --fail --silent --show-error --output /dev/null "${base_url}/robots.txt"
          curl --fail --silent --show-error --output /dev/null "${base_url}/favicon.png"

          not_found_status=$(curl --silent --show-error \
            --output "${body}" \
            --write-out '%{http_code}' \
            "${base_url}/not-a-real-route")
          test "${not_found_status}" = '404'
          grep -q '404: Page Not Found' "${body}"

          asset_path=$(python3 - "${body}" <<'PY'
          import re
          import sys
          from pathlib import Path

          html = Path(sys.argv[1]).read_text()
          match = re.search(r'/assets/[^" ]+\.(?:css|js|webp|jpeg|gif|png)', html)
          if match is None:
              raise SystemExit('No hashed asset found in deployed HTML')
          print(match.group(0))
          PY
          )
          curl --fail --silent --show-error \
            --dump-header "${headers}" \
            --output /dev/null \
            "${base_url}${asset_path}"
          grep -Eqi '^cache-control:.*max-age=31536000.*immutable' "${headers}"

          echo "url=${base_url}" >> "${GITHUB_OUTPUT}"

      - name: Check out deployed ref for remote smoke tests
        if: steps.freshness.outputs.should-deploy == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Set up Bun for remote smoke tests
        if: steps.freshness.outputs.should-deploy == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install remote smoke test dependencies
        if: steps.freshness.outputs.should-deploy == 'true'
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Run remote Playwright smoke tests
        if: steps.freshness.outputs.should-deploy == 'true'
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deployment-url.outputs.url }}
        run: bun run test:smoke
