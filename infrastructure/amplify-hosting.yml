AWSTemplateFormatVersion: "2010-09-09"
Description: Static AWS Amplify Hosting, CloudFront delivery, DNS, and GitHub OIDC access for diloreto.com

Parameters:
  EnableCustomDomain:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Create the ACM certificate and attach the apex and www aliases to CloudFront.
  EnableDnsCutover:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Create Route 53 apex and www aliases after the CloudFront custom domain is ready.
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[^:]+:iam::[0-9]{12}:oidc-provider/token\\.actions\\.githubusercontent\\.com$"
    Description: Existing GitHub Actions OIDC provider ARN. Leave empty to create it in this stack.
  GitHubRepository:
    Type: String
    Default: soodoh/diloreto-website
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
  GitHubEnvironment:
    Type: String
    Default: production
    AllowedPattern: "^[A-Za-z0-9_.-]+$"
  BranchName:
    Type: String
    Default: main
    AllowedPattern: "^[A-Za-z0-9_.-]+$"
  DomainName:
    Type: String
    Default: diloreto.com
    AllowedPattern: "^(?!-)[A-Za-z0-9.-]+[A-Za-z0-9]$"
  DeploymentRoleName:
    Type: String
    Default: diloreto-website-github-deploy
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]+$"
  HostedZoneId:
    Type: String
    Default: Z07741203I5VR48TBSMSA
    AllowedPattern: "^Z[A-Z0-9]+$"
    Description: Public Route 53 hosted zone ID for DomainName.

Rules:
  DnsCutoverRequiresCustomDomain:
    RuleCondition: !Equals [!Ref EnableDnsCutover, "true"]
    Assertions:
      - Assert: !Equals [!Ref EnableCustomDomain, "true"]
        AssertDescription: EnableCustomDomain must be true when EnableDnsCutover is true.

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, ""]
  CreateCustomDomain: !Equals [!Ref EnableCustomDomain, "true"]
  CreateDnsRecords: !And
    - !Condition CreateCustomDomain
    - !Equals [!Ref EnableDnsCutover, "true"]

Resources:
  AmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: diloreto-website
      Description: Fully static hosting for diloreto.com, deployed by GitHub Actions.
      Platform: WEB
      EnableBranchAutoDeletion: false
      CustomRules: []
      CustomHeaders: |
        customHeaders:
          - pattern: '/assets/*'
            headers:
              - key: 'Cache-Control'
                value: 'public, max-age=31536000, immutable'
          - pattern: '**/*.html'
            headers:
              - key: 'Cache-Control'
                value: 'no-cache'
          - pattern: '/'
            headers:
              - key: 'Cache-Control'
                value: 'no-cache'
          - pattern: '/areyou*'
            headers:
              - key: 'Cache-Control'
                value: 'no-cache'
          - pattern: '/robots.txt'
            headers:
              - key: 'Cache-Control'
                value: 'no-cache'
          - pattern: '/favicon.png'
            headers:
              - key: 'Cache-Control'
                value: 'no-cache'
          - pattern: '**'
            headers:
              - key: 'X-Content-Type-Options'
                value: 'nosniff'
              - key: 'X-Frame-Options'
                value: 'DENY'
              - key: 'Referrer-Policy'
                value: 'strict-origin-when-cross-origin'
              - key: 'Permissions-Policy'
                value: 'camera=(), geolocation=(), microphone=()'
      Tags:
        - Key: Project
          Value: diloreto-website
        - Key: ManagedBy
          Value: CloudFormation

  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: !Ref BranchName
      Description: Production branch populated by GitHub Actions manual deployments.
      Stage: PRODUCTION
      EnableAutoBuild: false
      EnablePerformanceMode: false
      EnablePullRequestPreview: false
      Tags:
        - Key: Project
          Value: diloreto-website
        - Key: ManagedBy
          Value: CloudFormation

  EdgeCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: diloreto-website-edge-cache
        Comment: Honor Amplify Cache-Control while forwarding query strings.
        DefaultTTL: 0
        MinTTL: 0
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: all

  EdgeRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: diloreto-website-request
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www and internally normalize clean static paths.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function addQueryValue(parts, key, value) {
          parts.push(key + '=' + value);
        }

        function querySuffix(querystring) {
          var parts = [];
          for (var key in querystring) {
            var entry = querystring[key];
            if (entry.multiValue) {
              for (var index = 0; index < entry.multiValue.length; index += 1) {
                addQueryValue(parts, key, entry.multiValue[index].value);
              }
            } else {
              addQueryValue(parts, key, entry.value);
            }
          }
          return parts.length === 0 ? '' : '?' + parts.join('&');
        }

        function handler(event) {
          var request = event.request;
          var host = request.headers.host && request.headers.host.value.toLowerCase();

          if (host === 'www.${DomainName}') {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {
                location: {
                  value: 'https://${DomainName}' + request.uri + querySuffix(request.querystring)
                }
              }
            };
          }

          var finalSegment = request.uri.slice(request.uri.lastIndexOf('/') + 1);
          if (request.uri !== '/' && request.uri.slice(-1) !== '/' && finalSegment.indexOf('.') === -1) {
            request.uri += '/';
          }
          return request;
        }
      Tags:
        - Key: Project
          Value: diloreto-website
        - Key: ManagedBy
          Value: CloudFormation

  EdgeCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateCustomDomain
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "www.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub "www.${DomainName}"
          HostedZoneId: !Ref HostedZoneId
      KeyAlgorithm: RSA_2048
      CertificateTransparencyLoggingPreference: ENABLED
      Tags:
        - Key: Project
          Value: diloreto-website
        - Key: ManagedBy
          Value: CloudFormation

  EdgeDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases: !If
          - CreateCustomDomain
          - - !Ref DomainName
            - !Sub "www.${DomainName}"
          - !Ref AWS::NoValue
        Comment: Canonical edge delivery for the static diloreto-website Amplify origin.
        CacheBehaviors:
          - AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: !Ref EdgeCachePolicy
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt EdgeRequestFunction.FunctionMetadata.FunctionARN
            PathPattern: assets/*
            TargetOriginId: AmplifyOrigin
            ViewerProtocolPolicy: redirect-to-https
        CustomErrorResponses:
          - ErrorCachingMinTTL: 0
            ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt EdgeRequestFunction.FunctionMetadata.FunctionARN
          TargetOriginId: AmplifyOrigin
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: AmplifyOrigin
            DomainName: !Sub "${AmplifyBranch.BranchName}.${AmplifyApp.DefaultDomain}"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        PriceClass: PriceClass_100
        ViewerCertificate: !If
          - CreateCustomDomain
          - AcmCertificateArn: !Ref EdgeCertificate
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: diloreto-website
        - Key: ManagedBy
          Value: CloudFormation

  ApexIpv4Record:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecords
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt EdgeDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2

  ApexIpv6Record:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecords
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt EdgeDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2

  WwwIpv4Record:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecords
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt EdgeDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2

  WwwIpv6Record:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecords
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt EdgeDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: diloreto-website
        - Key: ManagedBy
          Value: CloudFormation

  GitHubDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref DeploymentRoleName
      Description: Publishes validated static artifacts to the diloreto-website Amplify main branch.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: PublishAmplifyArtifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - amplify:CreateDeployment
                  - amplify:StartDeployment
                Resource: !Sub "${AmplifyBranch.Arn}/deployments/*"
              - Effect: Allow
                Action: amplify:GetJob
                Resource: !Sub "${AmplifyBranch.Arn}/jobs/*"
      Tags:
        - Key: Project
          Value: diloreto-website
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  AmplifyAppId:
    Description: Amplify application ID.
    Value: !GetAtt AmplifyApp.AppId
  AmplifyAppArn:
    Description: Amplify application ARN.
    Value: !GetAtt AmplifyApp.Arn
  AmplifyDefaultDomain:
    Description: Amplify-generated application domain.
    Value: !GetAtt AmplifyApp.DefaultDomain
  AmplifyBranchName:
    Description: Production Amplify branch name.
    Value: !GetAtt AmplifyBranch.BranchName
  AmplifyBranchArn:
    Description: Production Amplify branch ARN.
    Value: !GetAtt AmplifyBranch.Arn
  AmplifyBranchUrl:
    Description: Default production branch URL.
    Value: !Sub "https://${AmplifyBranch.BranchName}.${AmplifyApp.DefaultDomain}"
  GitHubDeploymentRoleArn:
    Description: IAM role assumed by the GitHub production environment through OIDC.
    Value: !GetAtt GitHubDeploymentRole.Arn
  GitHubOidcProviderArn:
    Description: GitHub Actions OIDC provider created or reused by this stack.
    Value: !If
      - CreateGitHubOidcProvider
      - !Ref GitHubOidcProvider
      - !Ref ExistingGitHubOidcProviderArn
  EdgeDistributionId:
    Description: CloudFront distribution ID.
    Value: !Ref EdgeDistribution
  EdgeDefaultDomain:
    Description: CloudFront-generated domain used for pre-cutover validation.
    Value: !GetAtt EdgeDistribution.DomainName
  EdgeDefaultUrl:
    Description: CloudFront-generated URL used for pre-cutover validation.
    Value: !Sub "https://${EdgeDistribution.DomainName}"
  EdgeCertificateArn:
    Condition: CreateCustomDomain
    Description: ACM certificate ARN for the apex and www names.
    Value: !Ref EdgeCertificate
  ProductionUrl:
    Condition: CreateDnsRecords
    Description: Canonical production URL.
    Value: !Sub "https://${DomainName}"
